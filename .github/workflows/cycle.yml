name: cycle
# One workflow = one full Austin Beefs cycle (CLAUDE.md Step 1-10).
# It runs DAILY but exits early unless it's been >= cadence_days since the last
# post. To change frequency, edit cadence_days in config.json - nothing here.

on:
  schedule:
    - cron: '0 22 * * *'    # 22:00 UTC daily (~17:00 America/Chicago). Adjust as needed.
  workflow_dispatch:         # lets you run it by hand for testing

jobs:
  cycle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }

      # --- CADENCE GATE: cheap check before spending any API budget ----------
      # SINGLE SOURCE OF TRUTH: scripts/state.py. Do NOT re-implement the cadence
      # or state-validity rules here. Two copies drift - and the drift we already
      # hit was this gate swallowing a corrupt current_round.json and reporting a
      # cold start, which would silently re-run Round 1 and lose the round
      # history. state.is_post_due() halts on corrupt state; this step turns that
      # halt into a hard job failure.
      - name: Is a post due today?
        id: gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, "scripts")
          import state

          try:
              cfg = state.load_config()
              n = state.cadence_days(config=cfg)
              cr = state.read_current_round()     # halts if present-but-broken
              due = state.is_post_due()
          except state.StateError as e:
              print(f"::error title=Corrupt Austin Beefs state::{e}")
              print("Refusing to continue. A corrupt state file is NOT a cold "
                    "start - continuing would re-run Round 1 and lose the round "
                    "history. Fix or deliberately delete the file.", file=sys.stderr)
              sys.exit(1)

          if cr is None:
              print(f"no current_round.json -> cold start, due=True (cadence {n}d)")
          else:
              print(f"round {cr.get('round')} posted {str(cr.get('posted_at'))[:10]}; "
                    f"cadence {n}d; due={due}")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"due={'true' if due else 'false'}\n")
              # phase, so the PR step and the commit step stay mutually exclusive
              f.write(f"auto={'true' if cfg.get('auto_publish') is True else 'false'}\n")
          PY

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.due == 'true'
        with: { node-version: '20' }

      - name: Install Claude Code + Playwright (for the render step)
        if: steps.gate.outputs.due == 'true'
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install playwright
          python3 -m playwright install --with-deps chromium

      - name: Run the cycle
        if: steps.gate.outputs.due == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BLOTATO_API_KEY:   ${{ secrets.BLOTATO_API_KEY }}
          FB_PAGE_TOKEN:     ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID:        ${{ secrets.FB_PAGE_ID }}
        run: |
          claude -p "$(cat prompts/cycle.md)" \
            --mcp-config .mcp.json \
            --dangerously-skip-permissions

      # --- REVIEW PHASE: open a PR instead of committing (while auto_publish:false)
      # The cycle prompt itself decides whether it already posted (auto) or just
      # staged files (review). If it staged a next-card for approval, this opens
      # the PR.
      # REVIEW PHASE ONLY. In autonomous mode the conductor DELETES the staged
      # artifacts and moves the PNG to published/ - those deletions are still
      # changes under queue/, so without the phase gate this would open a
      # spurious PR while the commit step pushes to main.
      - name: Open review PR (if anything staged)
        if: steps.gate.outputs.due == 'true' && steps.gate.outputs.auto == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: cycle/next          # STABLE: refreshes one PR instead of opening one per day
          title: "Austin Beefs - next card for review"
          body: |
            The next card is staged here. **Merging posts it** - that push fires
            `publish-staged.yml`.

            **The deadline is computed at MERGE time, not now.** The preview PNG
            shows `SET ON POST` in the deadline slot on purpose, so it cannot
            imply a date that would be wrong by the time you merge (G3). At merge
            the card is re-rendered with the real deadline, and the publisher
            **refuses to post if any slot other than DEADLINE changed** - what you
            reviewed is what ships.

            Review: the preview PNG, `*_slots.json` (the exact text), and
            `*_caption.tmpl` (`{{DEADLINE}}` is filled at merge).
            Close the PR to skip this round.
            (Verdict cards especially: sanity-check the tallied winner.)
          # queue/ ONLY. In review phase the conductor writes nothing else: root
          # current_round.json and canon.json are written by the publish-on-merge
          # job at POST time. At cold start they do not exist, and naming them
          # here made git add fail the whole step:
          #   fatal: pathspec 'current_round.json' did not match any files
          add-paths: |
            queue/

      # --- AUTONOMOUS PHASE: once auto_publish:true, persist state directly ---
      - name: Commit state (autonomous phase only)
        if: steps.gate.outputs.due == 'true' && steps.gate.outputs.auto == 'true'
        run: |
          git config user.name "austin-beefs"
          git config user.email "bot@users.noreply.github.com"
          # `git add` is ATOMIC across pathspecs: one missing path aborts the
          # whole command and stages NOTHING - even the paths that do exist.
          # The old `git add a b c || true` therefore degraded to a SILENT no-op
          # whenever any path was absent: no commit, no push, no error. In
          # autonomous mode that means a post goes live and its state is never
          # recorded (the D5 failure). Add only what exists.
          for p in current_round.json canon.json queue published reference_bank.json reports; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet || git commit -m "cycle: $(date -u +%F)"
          git push
